spring.application.name=javanext
server.port=0

# H2 In-Memory Database for Testing
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# JPA Batch Processing
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.batch_versioned_data=true

# Disable Kafka auto-configuration for tests
spring.kafka.bootstrap-servers=
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

# Kafka Topics (still needed for bean initialization even if Kafka is disabled)
kafka.topic.orders=test.orders.events
kafka.topic.payments=test.payments.events
kafka.topic.inventory=test.inventory.events

# Disable outbox relay in tests
outbox.relay.batch-size=100
outbox.relay.fixed-delay=60000

# API Documentation
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
